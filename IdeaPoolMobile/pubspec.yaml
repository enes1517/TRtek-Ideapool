name: idea_pool_mobile
description: "ASP.NET Core Web API & Flutter Starter Template"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  google_sign_in: ^6.2.1
  intl: ^0.19.0
  file_picker: ^8.1.4
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.21
