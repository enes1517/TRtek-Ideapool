version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ideapool_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: IdeaPoolDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./IdeaPool
      dockerfile: Dockerfile
    container_name: ideapool_api
    environment:
      - ConnectionStrings__Connection=Host=db;Port=5432;Database=IdeaPoolDb;Username=postgres;Password=123456
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5139:5139"
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./IdeaPoolMobile
      dockerfile: Dockerfile
    container_name: ideapool_web
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
